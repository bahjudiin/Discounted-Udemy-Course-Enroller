name: CI

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run unit tests
        run: pytest tests/test_base.py -q

  smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scrape all coupon sites
        run: python tests/smoke_all.py

      - name: Open issue if a scraper broke
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Scraper smoke test failed";
            const body =
              "The scheduled scraper smoke test failed on `" +
              new Date().toISOString() +
              "` (commit `" + context.sha.slice(0, 7) + "`).\n\n" +
              "One or more coupon sites stopped returning courses or threw " +
              "errors - they may have changed their HTML. Check the Actions " +
              "log for which site(s) failed.\n\n" +
              "This job makes no commits; it only reports problems.";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              creator: "github-actions",
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
              });
            }
